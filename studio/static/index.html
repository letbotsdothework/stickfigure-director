<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --panel2:#11141a; --border:#2a2f3a; --text:#e6e8ec; --muted:#8b93a3; --accent:#4f8cff; --green:#2ecc71; --danger:#e5484d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  #app { display:flex; height:100vh; }
  #sidebar { width:300px; min-width:300px; background:var(--panel); border-right:1px solid var(--border); padding:16px; overflow-y:auto; }
  #sidebar h1 { font-size:16px; margin:0 0 16px; }
  .proj { padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; }
  .proj:hover { background:#22262f; }
  .proj.active { border-color:var(--accent); background:#1c2434; }
  .proj .t { font-weight:600; font-size:14px; }
  .proj .s { font-size:12px; color:var(--muted); margin-top:2px; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .badge.ok { background:#13233a; color:var(--accent); }
  .badge.conf { background:#1a2e1a; color:var(--green); }
  #main { flex:1; overflow-y:auto; padding:24px; }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .bar input[type=text] { font-size:18px; font-weight:600; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--text); padding:4px 2px; width:100%; max-width:600px; }
  button { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  button.danger { background:var(--danger); }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:default; }
  a.btn { text-decoration:none; }
  video { width:100%; max-width:720px; border-radius:8px; background:#000; margin-bottom:16px; display:block; }
  .sec { margin-bottom:24px; }
  .sec h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 10px; }
  textarea { width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px; font-family:inherit; font-size:13px; resize:vertical; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .scene { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--panel); }
  .scene .head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .scene .head .n { font-weight:700; color:var(--accent); }
  .scene .head .c { color:var(--muted); font-size:12px; }
  .scene .head input[type=number] { width:62px; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:4px; padding:3px 6px; }
  .scene .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:900px) { .scene .row { grid-template-columns:1fr; } }
  .scene label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; }
  .toast { position:fixed; bottom:20px; right:20px; background:#1a2e1a; border:1px solid var(--green); color:var(--green); padding:10px 16px; border-radius:8px; display:none; z-index:10; }
  .hint { color:var(--muted); font-size:12px; }
  #empty { color:var(--muted); }
  .queueadd { display:flex; gap:6px; margin-bottom:10px; }
  .queueadd input { flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; font-size:13px; min-width:0; }
  .queueadd input:focus { outline:none; border-color:var(--accent); }
  .queueadd button { padding:6px 11px; flex-shrink:0; }
  .qitem { padding:8px 10px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; background:var(--panel2); position:relative; }
  .qitem.clickable { cursor:pointer; }
  .qitem.clickable:hover { border-color:var(--accent); }
  .qitem .t { font-size:13px; font-weight:600; padding-right:18px; }
  .qitem .s { font-size:11px; color:var(--muted); margin-top:3px; }
  .qitem .x { position:absolute; top:8px; right:8px; color:var(--muted); cursor:pointer; font-size:12px; }
  .qitem .x:hover { color:var(--danger); }
  .qstat { display:inline-block; font-size:10px; padding:1px 6px; border-radius:8px; margin-left:6px; vertical-align:middle; }
  .qstat.pending { background:#2a2a1a; color:#e6c66b; }
  .qstat.scripted { background:#13233a; color:var(--accent); }
  .qstat.done { background:#1a2e1a; color:var(--green); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>🎬 Studio</h1>
    <div class="sec">
      <h2>Warteliste</h2>
      <div class="queueadd">
        <input type="text" id="newtopic" placeholder="What if …?">
        <button id="addtopic" title="Thema einreihen">+</button>
      </div>
      <div id="queuelist"></div>
    </div>
    <div class="sec">
      <h2>Projekte</h2>
      <div id="projlist"></div>
      <button id="newproj" class="ghost" style="width:100%;margin-top:12px">+ Neues Projekt</button>
    </div>
  </aside>
  <main id="main">
    <div id="empty" class="hint">Projekt links auswählen.</div>
    <div id="detail" style="display:none"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
let state = { projects: [], current: null, script: null };

async function api(url, opts={}) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.text().catch(()=>'')) || r.status);
  return r.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2600);
}

async function loadProjects() {
  state.projects = await api('/api/projects');
  renderProjects();
}

function renderProjects() {
  const el = document.getElementById('projlist');
  el.innerHTML = '';
  for (const p of state.projects) {
    const d = document.createElement('div');
    d.className = 'proj' + (state.current === p.id ? ' active' : '');
    const status = p.confirmed
      ? '<span class="badge conf">✓ fertig</span>'
      : (p.has_master ? '<span class="badge ok">Master</span>' : (p.clips ? `<span class="badge ok">${p.clips} Clips</span>` : ''));
    d.innerHTML = `<div class="t">${esc(p.title)}</div><div class="s">${p.scene_count} Szenen${status}</div>`;
    d.onclick = () => openProject(p.id);
    el.appendChild(d);
  }
}

async function openProject(id) {
  state.current = id;
  renderProjects();
  state.script = await api('/api/projects/' + id);
  renderDetail(id);
}

function renderDetail(id) {
  const p = state.projects.find(x => x.id === id);
  const s = state.script;
  const el = document.getElementById('detail');
  el.style.display = 'block';
  document.getElementById('empty').style.display = 'none';
  el.innerHTML = `
    <div class="bar">
      <input type="text" id="title" value="${esc(s.title)}">
      <button onclick="saveScript()">💾 Skript speichern</button>
      ${p.confirmed
        ? '<span class="badge conf">✓ als fertig bestätigt</span>'
        : (p.has_master ? '<button class="danger" onclick="confirmProject()">✓ Video als fertig bestätigen</button>' : '<span class="hint">(noch kein Original — erst bauen)</span>')}
    </div>
    ${p.has_preview ? `<video id="pv" controls src="/api/projects/${id}/preview"></video>` : '<div class="hint">Noch keine Vorschau.</div>'}
    <div class="bar">
      ${p.has_master
        ? `<a class="btn" href="/api/projects/${id}/master" download><button class="ghost">⬇ Original herunterladen (${fmt(p.master_size)})</button></a>`
        : ''}
      <span class="hint">${p.has_preview ? 'Vorschau: ' + fmt(p.preview_size) : ''}</span>
    </div>
    <div class="sec">
      <h2>Thema / Topic</h2>
      <textarea id="topic" rows="2">${esc(s.topic || '')}</textarea>
    </div>
    <div class="sec">
      <h2>Szenen (${s.scenes.length})</h2>
      <div id="scenes"></div>
    </div>
  `;
  const sc = document.getElementById('scenes');
  s.scenes.forEach((scene, i) => {
    const card = document.createElement('div');
    card.className = 'scene';
    card.innerHTML = `
      <div class="head">
        <span class="n">#${scene.id}</span>
        <span class="c">${esc(scene.chapter || '')}</span>
        <span class="c">·</span>
        <input type="number" data-i="${i}" data-f="duration_seconds" value="${scene.duration_seconds}" min="4" max="10" step="2">
        <span class="c">s</span>
        <span class="c" style="margin-left:auto">${esc(scene.timtom_mode || '')}</span>
      </div>
      <div class="row">
        <div><label>Narration</label><textarea data-i="${i}" data-f="narration" rows="2">${esc(scene.narration)}</textarea></div>
        <div><label>Visual</label><textarea data-i="${i}" data-f="visual" rows="3">${esc(scene.visual)}</textarea></div>
      </div>
    `;
    sc.appendChild(card);
  });
}

async function saveScript() {
  const s = state.script;
  s.title = document.getElementById('title').value;
  s.topic = document.getElementById('topic').value;
  document.querySelectorAll('#scenes [data-f]').forEach(el => {
    const i = +el.dataset.i, f = el.dataset.f;
    s.scenes[i][f] = (f === 'duration_seconds') ? +el.value : el.value;
  });
  await api('/api/projects/' + state.current + '/script', {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(s)
  });
  toast('Skript gespeichert ✓');
}

async function confirmProject() {
  if (!confirm('Video als fertig bestätigen?\n\nDanach werden die Zwischendateien bereinigt — es bleibt nur das Original (und Vorschau).')) return;
  await api('/api/projects/' + state.current + '/confirm', { method: 'POST' });
  toast('Bestätigt — Bereinigung läuft');
  await loadProjects();
  await openProject(state.current);
}

async function loadQueue() {
  const q = await api('/api/queue');
  renderQueue(q.queue);
}

function renderQueue(list) {
  const el = document.getElementById('queuelist');
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<div class="hint">Keine Themen.</div>'; return; }
  for (const e of list) {
    const st = e.status === 'done' ? '<span class="qstat done">✓ fertig</span>'
      : e.status === 'scripted' ? '<span class="qstat scripted">Skript ✓</span>'
      : '<span class="qstat pending">wartet</span>';
    const pr = e.progress || {};
    const prog = pr.has_master ? ' · Master ✓'
      : pr.clips ? ` · ${pr.clips}/${pr.scene_count} Clips`
      : pr.scene_count ? ` · ${pr.scene_count} Szenen` : '';
    const d = document.createElement('div');
    d.className = 'qitem' + (e.project_id ? ' clickable' : '');
    d.innerHTML = `<span class="x" title="entfernen">✕</span><div class="t">${esc(e.topic)}${st}</div><div class="s">${esc(e.status)}${prog}</div>`;
    d.querySelector('.x').onclick = (ev) => { ev.stopPropagation(); delTopic(e.id); };
    if (e.project_id) d.onclick = () => openProject(e.project_id);
    el.appendChild(d);
  }
}

async function addTopic() {
  const inp = document.getElementById('newtopic');
  const topic = inp.value.trim();
  if (!topic) { inp.focus(); return; }
  try {
    await api('/api/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({topic}) });
    inp.value = '';
    toast('Thema zur Warteliste hinzugefügt ✓');
    await loadQueue();
  } catch (e) { toast('Fehler: ' + e.message); }
}

async function delTopic(id) {
  if (!confirm('Thema aus der Warteliste entfernen?')) return;
  try {
    await api('/api/queue/' + id, { method:'DELETE' });
    await loadQueue();
  } catch (e) { toast('Fehler: ' + e.message); }
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }
function fmt(b) { return b > 1048576 ? (b/1048576).toFixed(0) + ' MB' : (b/1024).toFixed(0) + ' KB'; }

document.getElementById('newproj').onclick = async () => {
  const title = prompt('Titel des neuen Projekts:');
  if (!title) return;
  try {
    const r = await api('/api/projects', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title, topic:''})
    });
    toast('Projekt erstellt ✓');
    await loadProjects();
    await openProject(r.id);
  } catch (e) { toast('Fehler: ' + e.message); }
};

document.getElementById('addtopic').onclick = addTopic;
document.getElementById('newtopic').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTopic(); });

loadProjects();
loadQueue();
</script>
</body>
</html>
